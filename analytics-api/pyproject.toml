[project]
name = "analytics-api"
version = "0.1.0"
description = "Leagues Match Analytics API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cachetools>=5.5.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "numpy>=2.0.0",
    "pydantic>=2.10.0",
    "scipy>=1.14.0",
    "uvicorn[standard]>=0.32.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "respx>=0.22.0",
    "ruff>=0.8.0",
]
training = [
    "matplotlib>=3.9.0",
    "pandas>=2.2.0",
    "pyarrow>=18.0.0",
    "scikit-learn>=1.5.0",
    "statsbombpy>=1.15.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
